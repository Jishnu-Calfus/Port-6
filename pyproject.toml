[project]
name = "port6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3",
    "langchain-classic>=1.0",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-experimental>=0.3",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5",
    "faiss-cpu>=1.9",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.2",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "redis>=5.1",
    "ragas>=0.2",
    "streamlit[pdf]>=1.40",
    "requests>=2.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "langsmith>=0.1.147",
    "langchain-redis>=0.2.5",
]

[project.optional-dependencies]
guardrails = ["nemoguardrails>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/port6"]
